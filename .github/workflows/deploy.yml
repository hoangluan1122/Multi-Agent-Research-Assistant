name: Deploy PaperFlow

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.2.2
        env:
          DB_URL: ${{ secrets.DATABASE_URL }}
          LLM_MODEL: ${{ secrets.DEFAULT_LLM_MODEL || 'gemini-2.5-flash' }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          envs: DB_URL,LLM_MODEL
          script: |
            set -e

            cd /var/www/Multi-Agent-Research-Assistant

            echo "Fetching latest code..."
            git fetch origin main

            echo "Resetting to latest main..."
            git reset --hard origin/main

            echo "Installing backend dependencies..."
            /var/www/Multi-Agent-Research-Assistant/Backend/.venv/bin/python -m pip install -r Backend/requirements.txt
            /var/www/Multi-Agent-Research-Assistant/Backend/.venv/bin/python -m pip install 'pytest>=8,<9' 'pytest-asyncio>=0.24,<1'

            # @trace: REQ-027, REQ-029
            echo "Configuring environment variables safely..."
            mkdir -p Backend
            touch Backend/.env

            # Cập nhật DATABASE_URL từ Secret nếu có, không làm lộ mật khẩu trong git
            if [ -n "$DB_URL" ]; then
              if grep -q "^DATABASE_URL=" Backend/.env; then
                sed -i "s|^DATABASE_URL=.*|DATABASE_URL=$DB_URL|" Backend/.env
              else
                echo "DATABASE_URL=$DB_URL" >> Backend/.env
              fi
            fi

            # Tôn trọng cấu hình model mặc định hoặc lựa chọn người dùng (gemini-2.5-flash)
            if ! grep -q "^DEFAULT_LLM_MODEL=" Backend/.env; then
              echo "DEFAULT_LLM_MODEL=$LLM_MODEL" >> Backend/.env
            fi

            echo "Building frontend..."
            cd Frontend
            npm ci || npm install
            npm run build
            cd ..

            echo "Restarting PaperFlow..."
            systemctl restart paperflow

            echo "Checking service status..."
            sleep 3
            systemctl is-active --quiet paperflow

            # @trace: REQ-030
            echo "Running smoke tests on deployed backend..."
            /var/www/Multi-Agent-Research-Assistant/Backend/.venv/bin/python -m pytest Backend/tests/test_smoke_api.py Backend/tests/test_translation.py -v

            echo "Deploy successful!"
